spring.application.name=integracap-hikcentral
server.port=8081
# Banco SQLite do cadastro de assistidos (arquivo em ./data na raiz do projeto)
spring.datasource.url=jdbc:sqlite:./data/fundacao_maria_mae.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Integração opcional com a OpenAPI local do HikCentral. Mantenha desabilitada
# até configurar o endereço e as credenciais fornecidas pela Fundação.
hikcentral.integracao.enabled=${HIKCENTRAL_ENABLED:false}
hikcentral.integracao.base-url=${HIKCENTRAL_BASE_URL:}
hikcentral.integracao.api-key=${HIKCENTRAL_API_KEY:}
hikcentral.integracao.api-secret=${HIKCENTRAL_API_SECRET:}
hikcentral.integracao.org-index-code=${HIKCENTRAL_ORG_INDEX_CODE:}
hikcentral.integracao.privilege-group-id=${HIKCENTRAL_PRIVILEGE_GROUP_ID:}
