<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fundo Circular Verde Oficial -->
  <circle cx="250" cy="250" r="250" fill="#2d553f"/>
  
  <!-- Ilustração Mãe e Filho -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mão/Contorno Externo da Mãe -->
    <path d="M 120 280 C 70 180, 160 50, 270 50 C 330 50, 370 100, 370 150 C 370 180, 350 200, 340 220 C 320 260, 310 280, 310 320 C 310 360, 260 380, 210 380 C 160 380, 130 330, 120 280 Z" stroke-width="12"/>
    
    <!-- Perfil do Rosto da Mãe -->
    <path d="M 270 110 C 270 130, 250 145, 250 160 C 250 175, 275 190, 275 210 C 275 225, 250 240, 220 250" stroke-width="10"/>
    <path d="M 255 135 C 245 145, 235 155, 235 165" stroke-width="8"/>
    
    <!-- Coração / Bebê Acolhido -->
    <path d="M 310 220 C 340 180, 420 200, 425 260 C 430 320, 360 370, 310 390 C 280 370, 270 330, 280 290 C 290 260, 310 240, 310 220 Z" stroke-width="12"/>
    <path d="M 345 280 C 330 290, 320 310, 325 330 C 330 345, 345 355, 360 350" stroke-width="9"/>
  </g>
  
  <!-- Tipografia Fundação Maria Mãe -->
  <g fill="#ffffff" font-family="'Georgia', 'Times New Roman', serif" text-anchor="middle">
    <text x="250" y="415" font-size="38" font-weight="normal" letter-spacing="1">Fundação</text>
    <text x="250" y="455" font-size="42" font-weight="bold" letter-spacing="1">Maria Mãe</text>
  </g>
</svg>
