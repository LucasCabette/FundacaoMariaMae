<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fundação Maria Mãe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <div class="logo-area">
            <img src="logo.svg" alt="Logo Fundação Maria Mãe" class="logo-img">
            <span>Fundação Maria Mãe</span>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h1>Fundação Maria Mãe</h1>
            <p class="subtitulo">Sistema de Cadastro de Pessoas</p>

            <form id="loginForm">
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" placeholder="Digite seu usuário">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>

                <button type="submit" class="botao-principal">ENTRAR</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
