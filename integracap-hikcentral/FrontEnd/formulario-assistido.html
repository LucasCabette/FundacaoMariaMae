<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Assistido - Fundação Maria Mãe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <div class="logo-area">
            <img src="logo.jpeg" alt="Logo Fundação Maria Mãe" class="logo-img">
            <span>Fundação Maria Mãe</span>
        </div>
        <div class="usuario-area">
            <span>admin</span>
            <span>|</span>
            <button onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="page-container">
        <div class="titulo-pagina">
            <button class="btn-voltar" onclick="window.location.href='novo-cadastro.html'" title="Voltar">←</button>
            <h1>Cadastrar Novo Assistido (Manual)</h1>
        </div>

        <div class="card-painel" style="max-width: 700px; margin: 0 auto;">
            <form id="formNovoAssistido">
                <div class="campo">
                    <label for="cad-codigo">Código do Assistido *</label>
                    <input type="text" id="cad-codigo" placeholder="Ex: 2600000001" required>
                </div>

                <div class="campo">
                    <label for="cad-nome">Nome Completo *</label>
                    <input type="text" id="cad-nome" placeholder="Digite o nome completo" required>
                </div>

                <div class="campo">
                    <label for="cad-nascimento">Data de Nascimento *</label>
                    <input type="date" id="cad-nascimento" required>
                </div>

                <div class="campo">
                    <label for="cad-cpf">CPF (somente números)</label>
                    <input type="text" id="cad-cpf" placeholder="Ex: 12345678901" maxlength="11">
                </div>

                <div class="campo">
                    <label for="cad-rg">RG</label>
                    <input type="text" id="cad-rg" placeholder="Digite o RG">
                </div>

                <div class="campo">
                    <label for="cad-mae">Nome da Mãe</label>
                    <input type="text" id="cad-mae" placeholder="Digite o nome da mãe">
                </div>

                <div class="campo">
                    <label for="cad-pai">Nome do Pai</label>
                    <input type="text" id="cad-pai" placeholder="Digite o nome do pai">
                </div>

                <div class="campo">
                    <label for="cad-cidade">Cidade de Nascimento</label>
                    <input type="text" id="cad-cidade" placeholder="Ex: Juiz de Fora">
                </div>

                <div class="campo">
                    <label for="cad-sexo">Sexo</label>
                    <select id="cad-sexo" style="width: 100%; height: 42px; padding: 0 14px; border: 1px solid var(--cor-borda); border-radius: 5px;">
                        <option value="">Selecione...</option>
                        <option value="MASCULINO">Masculino</option>
                        <option value="FEMININO">Feminino</option>
                    </select>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 25px;">
                    <button type="submit" class="botao-principal">Avançar para Foto e Confirmação</button>
                    <button type="button" class="botao-principal" onclick="window.location.href='novo-cadastro.html'" style="background-color: var(--cor-texto-suave);">Cancelar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.getElementById("formNovoAssistido").addEventListener("submit", function(e) {
            e.preventDefault();
            const dados = {
                codigoAssistido: document.getElementById("cad-codigo").value.trim(),
                nome: document.getElementById("cad-nome").value.trim(),
                dataNascimento: document.getElementById("cad-nascimento").value,
                cpf: document.getElementById("cad-cpf").value.trim() || null,
                rg: document.getElementById("cad-rg").value.trim() || null,
                nomeMae: document.getElementById("cad-mae").value.trim() || null,
                nomePai: document.getElementById("cad-pai").value.trim() || null,
                cidadeNascimento: document.getElementById("cad-cidade").value.trim() || null,
                sexo: document.getElementById("cad-sexo").value || null
            };
            sessionStorage.setItem("dadosAssistidoTemp", JSON.stringify(dados));
            window.location.href = "confirmar-dados.html";
        });
    </script>
</body>
</html>
