<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Acervo | Biblioteca</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header><a class="marca" th:href="@{/livros}">BIBLIOTECA <span>•</span> laboratório de testes</a><nav><a class="ativo" th:href="@{/livros}">Acervo</a><a th:href="@{/alunos}">Alunos</a><a th:href="@{/emprestimos}">Empréstimos</a></nav></header>
<main><section class="intro"><p class="sobretitulo">ACERVO</p><h1>Livros prontos<br>para circular.</h1><p>Cadastre os títulos que poderão ser emprestados aos alunos.</p></section>
<p class="sucesso" th:if="${param.criado}">Livro cadastrado.</p><section class="grade"><form th:action="@{/livros}" th:object="${livro}" method="post" novalidate><h2>Novo livro</h2><label for="titulo">Título</label><input id="titulo" th:field="*{titulo}" aria-describedby="titulo-erro"><small id="titulo-erro" class="erro" th:errors="*{titulo}"></small><label for="autor">Autor</label><input id="autor" th:field="*{autor}" aria-describedby="autor-erro"><small id="autor-erro" class="erro" th:errors="*{autor}"></small><button type="submit">Cadastrar livro</button></form>
<section class="lista"><h2>Acervo cadastrado</h2><p class="vazio" th:if="${#lists.isEmpty(livros)}">Ainda não há livros. Cadastre o primeiro título.</p><article th:each="livro : ${livros}"><div><strong th:text="${livro.titulo}">Título</strong><span th:text="${livro.autor}">Autor</span></div><b th:text="${livro.disponivel ? 'Disponível' : 'Emprestado'}" th:classappend="${livro.disponivel ? ' status-ok' : ' status-off'}">Disponível</b></article></section></section></main></body></html>
