<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Empréstimos | Biblioteca</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header><a class="marca" th:href="@{/livros}">BIBLIOTECA <span>•</span> laboratório de testes</a><nav><a th:href="@{/livros}">Acervo</a><a th:href="@{/alunos}">Alunos</a><a class="ativo" th:href="@{/emprestimos}">Empréstimos</a></nav></header>
<main><section class="intro"><p class="sobretitulo">CIRCULAÇÃO</p><h1>O caminho de<br>cada exemplar.</h1><p>Um aluno pode manter até três empréstimos ativos.</p></section><p class="sucesso" th:if="${param.criado}">Empréstimo registrado.</p><p class="sucesso" th:if="${param.devolvido}">Devolução registrada.</p><p class="erro-bloco" th:if="${erro}" th:text="${erro}"></p>
<section class="grade"><form th:action="@{/emprestimos}" method="post" novalidate><h2>Novo empréstimo</h2><label for="livroId">Livro</label><select id="livroId" name="livroId" required><option value="">Selecione</option><option th:each="livro : ${livros}" th:if="${livro.disponivel}" th:value="${livro.id}" th:text="${livro.titulo}"></option></select><label for="alunoId">Aluno</label><select id="alunoId" name="alunoId" required><option value="">Selecione</option><option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option></select><button type="submit">Registrar empréstimo</button></form>
<section class="lista"><h2>Histórico</h2><p class="vazio" th:if="${#lists.isEmpty(emprestimos)}">Nenhum empréstimo registrado.</p><article th:each="emprestimo : ${emprestimos}"><div><strong th:text="${emprestimo.livro.titulo}">Livro</strong><span th:text="${emprestimo.aluno.nome}">Aluno</span></div><form th:if="${emprestimo.ativo}" th:action="@{/emprestimos/{id}/devolucao(id=${emprestimo.id})}" method="post" novalidate><button class="secundario" type="submit">Registrar devolução</button></form><b th:unless="${emprestimo.ativo}" class="status-ok">Devolvido</b></article></section></section></main></body></html>
