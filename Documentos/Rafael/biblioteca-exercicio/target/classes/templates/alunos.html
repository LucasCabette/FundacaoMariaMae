<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Alunos | Biblioteca</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header><a class="marca" th:href="@{/livros}">BIBLIOTECA <span>•</span> laboratório de testes</a><nav><a th:href="@{/livros}">Acervo</a><a class="ativo" th:href="@{/alunos}">Alunos</a><a th:href="@{/emprestimos}">Empréstimos</a></nav></header>
<main><section class="intro"><p class="sobretitulo">PESSOAS</p><h1>Quem pode<br>levar um livro?</h1><p>Registre os alunos antes de criar um empréstimo.</p></section><p class="sucesso" th:if="${param.criado}">Aluno cadastrado.</p>
<section class="grade"><form th:action="@{/alunos}" th:object="${aluno}" method="post" novalidate><h2>Novo aluno</h2><label for="nome">Nome</label><input id="nome" th:field="*{nome}"><small class="erro" th:errors="*{nome}"></small><label for="matricula">Matrícula</label><input id="matricula" th:field="*{matricula}"><small class="erro" th:errors="*{matricula}"></small><button type="submit">Cadastrar aluno</button></form>
<section class="lista"><h2>Alunos cadastrados</h2><p class="vazio" th:if="${#lists.isEmpty(alunos)}">Ainda não há alunos cadastrados.</p><article th:each="aluno : ${alunos}"><div><strong th:text="${aluno.nome}">Nome</strong><span th:text="${aluno.matricula}">Matrícula</span></div></article></section></section></main></body></html>
